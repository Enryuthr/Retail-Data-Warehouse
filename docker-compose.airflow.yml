services:
  airflow-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - airflow-postgres-db-volume:/var/lib/postgresql/data

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: retail-airflow:2.10.5
    depends_on:
      airflow-postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW_UID: 50000
      POSTGRES_HOST: host.docker.internal
      POSTGRES_PORT: 5432
      RETAIL_PROJECT_DIR: /opt/airflow/project
    volumes:
      - ./:/opt/airflow/project
      - ./airflow/dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs
    command: >
      bash -c "airflow db migrate &&
      (airflow users create
      --username admin
      --password admin
      --firstname Retail
      --lastname Admin
      --role Admin
      --email admin@example.com || true)"

  airflow-webserver:
    image: retail-airflow:2.10.5
    pull_policy: never
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW_UID: 50000
      POSTGRES_HOST: host.docker.internal
      POSTGRES_PORT: 5432
      RETAIL_PROJECT_DIR: /opt/airflow/project
    ports:
      - "${AIRFLOW_WEB_PORT:-18081}:8080"
    volumes:
      - ./:/opt/airflow/project
      - ./airflow/dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs
    command: webserver

  airflow-scheduler:
    image: retail-airflow:2.10.5
    pull_policy: never
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW_UID: 50000
      POSTGRES_HOST: host.docker.internal
      POSTGRES_PORT: 5432
      RETAIL_PROJECT_DIR: /opt/airflow/project
    volumes:
      - ./:/opt/airflow/project
      - ./airflow/dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs
    command: scheduler

  dbt:
    image: retail-airflow:2.10.5
    pull_policy: never
    env_file:
      - .env
    environment:
      POSTGRES_HOST: host.docker.internal
      POSTGRES_PORT: 5432
      RETAIL_PROJECT_DIR: /usr/app
    volumes:
      - ./:/usr/app
    working_dir: /usr/app
    entrypoint: ["bash", "-c", "exec \"$@\"", "dbt-entrypoint"]
    command: ["dbt", "--help"]

  metabase:
    image: metabase/metabase:v0.50.32
    ports:
      - "${METABASE_PORT:-13001}:3000"
    volumes:
      - metabase-data:/metabase-data
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      JAVA_TIMEZONE: Asia/Jakarta

  grafana:
    image: grafana/grafana:13.2.1
    depends_on:
      airflow-postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: Asia/Jakarta
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      POSTGRES_DB: ${POSTGRES_DB:-retail_dw}
      GRAFANA_RETAIL_DB_USER: ${GRAFANA_RETAIL_DB_USER}
      GRAFANA_RETAIL_DB_PASSWORD: ${GRAFANA_RETAIL_DB_PASSWORD}
      GRAFANA_AIRFLOW_DB_USER: ${GRAFANA_AIRFLOW_DB_USER}
      GRAFANA_AIRFLOW_DB_PASSWORD: ${GRAFANA_AIRFLOW_DB_PASSWORD}
    ports:
      - "${GRAFANA_PORT:-13002}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/api/health | grep -q '\"database\"[[:space:]]*:[[:space:]]*\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  airflow-postgres-db-volume:
  airflow-logs:
  metabase-data:
  grafana-data:
