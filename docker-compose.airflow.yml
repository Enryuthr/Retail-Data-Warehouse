services:
  retail-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-retail_dw}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-retail_dw}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - retail-postgres-db-volume:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d

  airflow-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - airflow-postgres-db-volume:/var/lib/postgresql/data

  airflow-init:
    image: apache/airflow:2.10.5-python3.11
    depends_on:
      airflow-postgres:
        condition: service_healthy
      retail-postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW_UID: 50000
      POSTGRES_HOST: retail-postgres
      RETAIL_PROJECT_DIR: /opt/airflow/project
      _PIP_ADDITIONAL_REQUIREMENTS: -r /opt/airflow/project/requirements.txt
    volumes:
      - ./:/opt/airflow/project
      - ./airflow/dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs
    command: >
      bash -c "airflow db migrate &&
      (airflow users create
      --username admin
      --password admin
      --firstname Retail
      --lastname Admin
      --role Admin
      --email admin@example.com || true)"

  airflow-webserver:
    image: apache/airflow:2.10.5-python3.11
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW_UID: 50000
      POSTGRES_HOST: retail-postgres
      RETAIL_PROJECT_DIR: /opt/airflow/project
      _PIP_ADDITIONAL_REQUIREMENTS: -r /opt/airflow/project/requirements.txt
    ports:
      - "8080:8080"
    volumes:
      - ./:/opt/airflow/project
      - ./airflow/dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs
    command: webserver

  airflow-scheduler:
    image: apache/airflow:2.10.5-python3.11
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW_UID: 50000
      POSTGRES_HOST: retail-postgres
      RETAIL_PROJECT_DIR: /opt/airflow/project
      _PIP_ADDITIONAL_REQUIREMENTS: -r /opt/airflow/project/requirements.txt
    volumes:
      - ./:/opt/airflow/project
      - ./airflow/dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs
    command: scheduler

  dbt:
    image: python:3.11-slim
    depends_on:
      retail-postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_HOST: retail-postgres
      RETAIL_PROJECT_DIR: /usr/app
    volumes:
      - ./:/usr/app
    working_dir: /usr/app
    entrypoint: ["bash", "-lc", "pip install -r requirements.txt && exec \"$@\"", "dbt-entrypoint"]
    command: ["dbt", "--help"]

  metabase:
    image: metabase/metabase:v0.50.32
    depends_on:
      retail-postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - metabase-data:/metabase-data
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      JAVA_TIMEZONE: Asia/Jakarta

volumes:
  retail-postgres-db-volume:
  airflow-postgres-db-volume:
  airflow-logs:
  metabase-data:
